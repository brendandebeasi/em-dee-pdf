[workspace]
resolver = "2"
members = [
    "crates/em-dee-pdf-core",
    "crates/em-dee-pdf-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Brendan DeBeasi <hi@neueway.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/brendandebeasi/em-dee-pdf"
description = "High-quality Markdown to PDF converter"
keywords = ["markdown", "pdf", "typst", "converter"]
categories = ["command-line-utilities", "text-processing"]

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
# Markdown parsing
comrak = "0.31"

# PDF generation via Typst
typst = "0.14"
typst-pdf = "0.14"
typst-as-lib = "0.15"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Async (for image fetching)
tokio = { version = "1", features = ["rt", "fs", "io-util"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# PDF compression
lopdf = "0.34"

# Utilities
dirs = "6"
tempfile = "3"
base64 = "0.22"
